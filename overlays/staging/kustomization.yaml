apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - namespace.yaml
  - ../../base
replicas:
  - name: skillbox-app
    count: 2
patches:
  - target:
      kind: Ingress
      name: skillbox-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.skillbox.local
images:
  - name: skillbox-app
    newTag: v2
