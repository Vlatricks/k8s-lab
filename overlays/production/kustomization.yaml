apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - namespace.yaml
  - ../../base
replicas:
  - name: skillbox-app
    count: 3
patches:
  - target:
      kind: Ingress
      name: skillbox-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: production.skillbox.local
