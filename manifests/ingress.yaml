apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillbox-app
  namespace: staging
spec:
  ingressClassName: nginx
  rules:
    - host: staging.skillbox.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skillbox-app
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillbox-app
  namespace: production
spec:
  ingressClassName: nginx
  rules:
    - host: production.skillbox.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skillbox-app
                port:
                  number: 80
