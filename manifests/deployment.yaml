apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillbox-app
  namespace: staging
  labels:
    app: skillbox-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skillbox-app
  template:
    metadata:
      labels:
        app: skillbox-app
    spec:
      containers:
        - name: skillbox-app
          image: skillbox-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
