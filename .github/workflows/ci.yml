name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: |
          for env in staging production; do
            echo "== $env =="
            kubectl kustomize overlays/$env | kubeconform -strict -summary
          done

  smoke-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Deploy staging (stand-in image)
        run: |
          kubectl kustomize overlays/staging \
            | sed -E 's#image: skillbox-app:.*#image: nginxinc/nginx-unprivileged:1.27-alpine#' \
            | kubectl apply -f -

      - name: Wait for rollout
        run: kubectl rollout status deployment/skillbox-app -n staging --timeout=180s

      - name: Smoke test
        run: |
          kubectl port-forward -n staging svc/skillbox-app 8080:80 &
          sleep 5
          curl -fsS http://localhost:8080/ > /dev/null

      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -n staging -o wide
          kubectl describe pods -n staging
          kubectl get events -n staging --sort-by=.lastTimestamp
