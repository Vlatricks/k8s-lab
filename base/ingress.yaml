apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillbox-app
spec:
  ingressClassName: nginx
  rules:
    - host: app.skillbox.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skillbox-app
                port:
                  number: 80
